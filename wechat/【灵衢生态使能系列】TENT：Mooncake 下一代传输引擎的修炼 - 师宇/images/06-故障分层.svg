<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L9,5.5 L1,10 Z" fill="#147ba8"/></marker><marker id="cyan" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L9,5.5 L1,10 Z" fill="#16a6a3"/></marker><marker id="orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L9,5.5 L1,10 Z" fill="#e59a3d"/></marker><marker id="red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L9,5.5 L1,10 Z" fill="#d8665c"/></marker></defs><rect width="1400" height="760" fill="#f4f8fa"/><rect x="40" y="35" width="1320" height="690" rx="28" fill="white"/><rect x="40" y="35" width="9" height="105" rx="4" fill="#16a6a3"/><text x="76" y="91" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#183047" text-anchor="start">06 / 故障分层</text><text x="76" y="131" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="500" fill="#60778b" text-anchor="start">故障发生在不同尺度，需要不同的处理边界</text><rect x="95" y="210" width="385" height="315" rx="22" fill="#ffffff" stroke="#c8d9e3" stroke-width="2"/><rect x="95" y="210" width="385" height="8" rx="4" fill="#e59a3d"/><text x="120" y="264" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#183047" text-anchor="start">路径异常</text><text x="120" y="304" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#60778b" text-anchor="start">记录错误、暂停新流量</text><text x="120" y="337" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#60778b" text-anchor="start">冷却后再观察是否恢复</text><rect x="510" y="210" width="385" height="315" rx="22" fill="#ffffff" stroke="#c8d9e3" stroke-width="2"/><rect x="510" y="210" width="385" height="8" rx="4" fill="#d8665c"/><text x="535" y="264" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#183047" text-anchor="start">设备异常</text><text x="535" y="304" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#60778b" text-anchor="start">关联端点退出服务</text><text x="535" y="337" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#60778b" text-anchor="start">收束在途操作后恢复</text><rect x="925" y="210" width="385" height="315" rx="22" fill="#ffffff" stroke="#c8d9e3" stroke-width="2"/><rect x="925" y="210" width="385" height="8" rx="4" fill="#147ba8"/><text x="950" y="264" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#183047" text-anchor="start">后端不可用</text><text x="950" y="304" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#60778b" text-anchor="start">交给运行时</text><text x="950" y="337" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#60778b" text-anchor="start">按候选策略处理</text><text x="495" y="383" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#60778b" text-anchor="middle">·</text><text x="910" y="383" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#60778b" text-anchor="middle">·</text><path d="M76 649 H1324" stroke="#c8d9e3" stroke-width="2"/><text x="76" y="688" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="500" fill="#60778b" text-anchor="start">旧操作还可能访问内存时，不能仅凭超时就直接释放资源。</text></svg>