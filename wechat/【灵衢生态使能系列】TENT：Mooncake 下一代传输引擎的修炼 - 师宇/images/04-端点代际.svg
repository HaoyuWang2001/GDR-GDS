<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L9,5.5 L1,10 Z" fill="#147ba8"/></marker><marker id="cyan" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L9,5.5 L1,10 Z" fill="#16a6a3"/></marker><marker id="orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L9,5.5 L1,10 Z" fill="#e59a3d"/></marker><marker id="red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L9,5.5 L1,10 Z" fill="#d8665c"/></marker></defs><rect width="1400" height="760" fill="#f4f8fa"/><rect x="40" y="35" width="1320" height="690" rx="28" fill="white"/><rect x="40" y="35" width="9" height="105" rx="4" fill="#16a6a3"/><text x="76" y="91" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#183047" text-anchor="start">04 / 端点代际</text><text x="76" y="131" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="500" fill="#60778b" text-anchor="start">端点身份与物理路径健康记录，解决的是两种问题</text><rect x="104" y="188" width="560" height="144" rx="22" fill="#ffffff" stroke="#c8d9e3" stroke-width="2"/><rect x="104" y="188" width="560" height="8" rx="4" fill="#e59a3d"/><text x="129" y="242" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#183047" text-anchor="start">旧端点 · 代际 N</text><text x="129" y="282" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#60778b" text-anchor="start">请求已提交，可能还有迟到事件</text><rect x="735" y="188" width="560" height="144" rx="22" fill="#ffffff" stroke="#c8d9e3" stroke-width="2"/><rect x="735" y="188" width="560" height="8" rx="4" fill="#16a6a3"/><text x="760" y="242" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#183047" text-anchor="start">新端点 · 代际 N+1</text><text x="760" y="282" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#60778b" text-anchor="start">独立建立，不继承旧完成结果</text><path d="M662 260 L730 260" fill="none" stroke="#147ba8" stroke-width="4" marker-end="url(#blue)"/><rect x="104" y="410" width="560" height="140" rx="22" fill="#ffffff" stroke="#c8d9e3" stroke-width="2"/><rect x="104" y="410" width="560" height="8" rx="4" fill="#e59a3d"/><text x="129" y="464" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#183047" text-anchor="start">旧完成事件迟到</text><text x="129" y="504" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#60778b" text-anchor="start">归属旧端点，不能记在新端点上</text><rect x="735" y="410" width="560" height="140" rx="22" fill="#ffffff" stroke="#c8d9e3" stroke-width="2"/><rect x="735" y="410" width="560" height="8" rx="4" fill="#147ba8"/><text x="760" y="464" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#183047" text-anchor="start">同一条物理路径</text><text x="760" y="504" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#60778b" text-anchor="start">健康历史保留，重建不清空病史</text><path d="M390 332 L390 410" fill="none" stroke="#e59a3d" stroke-width="4" marker-end="url(#orange)"/><path d="M1015 332 L1015 410" fill="none" stroke="#16a6a3" stroke-width="4" marker-end="url(#cyan)"/><path d="M76 649 H1324" stroke="#c8d9e3" stroke-width="2"/><text x="76" y="688" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="500" fill="#60778b" text-anchor="start">旧事件按旧代际处理；路径历史继续用于下一次选路。</text></svg>