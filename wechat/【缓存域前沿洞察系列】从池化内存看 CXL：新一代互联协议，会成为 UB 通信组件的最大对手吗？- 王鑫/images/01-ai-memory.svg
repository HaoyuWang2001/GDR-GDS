<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1200" height="8" fill="#2563EB"/>
  <text x="600" y="72" text-anchor="middle" font-size="34" font-weight="bold" fill="#0F2A5C">AI大模型时代，内存成为新的瓶颈</text>
  <text x="600" y="108" text-anchor="middle" font-size="18" fill="#64748B">算力之外，第二大瓶颈正在浮现</text>

  <!-- GPU chip -->
  <g>
    <text x="215" y="245" text-anchor="middle" font-size="20" font-weight="bold" fill="#334155">大模型推理</text>
    <rect x="140" y="260" width="150" height="170" rx="18" fill="#1E3A8A"/>
    <rect x="156" y="276" width="118" height="138" rx="12" fill="#3B82F6"/>
    <text x="215" y="342" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">GPU</text>
    <text x="215" y="376" text-anchor="middle" font-size="14" fill="#DBEAFE">算力强 · 显存小</text>
    <g fill="#1E3A8A">
      <rect x="290" y="272" width="14" height="10" rx="2"/>
      <rect x="290" y="298" width="14" height="10" rx="2"/>
      <rect x="290" y="324" width="14" height="10" rx="2"/>
      <rect x="290" y="350" width="14" height="10" rx="2"/>
      <rect x="290" y="376" width="14" height="10" rx="2"/>
      <rect x="290" y="402" width="14" height="10" rx="2"/>
    </g>
  </g>

  <!-- arrow -->
  <line x1="320" y1="345" x2="430" y2="345" stroke="#64748B" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arr)"/>
  <text x="375" y="325" text-anchor="middle" font-size="17" fill="#475569">推理请求涌入</text>

  <!-- bar 1 -->
  <text x="470" y="192" font-size="20" font-weight="bold" fill="#334155">KV Cache（对话记忆）</text>
  <rect x="470" y="206" width="560" height="34" rx="17" fill="#E2E8F0"/>
  <rect x="470" y="206" width="476" height="34" rx="17" fill="#EF4444"/>
  <text x="1046" y="231" font-size="22" font-weight="bold" fill="#EF4444">85%</text>

  <!-- bar 2 -->
  <text x="470" y="302" font-size="20" font-weight="bold" fill="#334155">128K 长上下文</text>
  <rect x="470" y="316" width="560" height="34" rx="17" fill="#E2E8F0"/>
  <rect x="470" y="316" width="392" height="34" rx="17" fill="#F97316"/>
  <text x="1046" y="341" font-size="22" font-weight="bold" fill="#F97316">70%</text>

  <!-- bar 3 -->
  <text x="470" y="412" font-size="20" font-weight="bold" fill="#334155">Agent 多轮并发任务</text>
  <rect x="470" y="426" width="560" height="34" rx="17" fill="#E2E8F0"/>
  <rect x="470" y="426" width="515" height="34" rx="17" fill="#7C3AED"/>
  <text x="1046" y="451" font-size="22" font-weight="bold" fill="#7C3AED">92%</text>

  <!-- footer note -->
  <rect x="140" y="530" width="920" height="72" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="600" y="562" text-anchor="middle" font-size="20" fill="#334155">内存占用随上下文长度与并发数快速膨胀</text>
  <text x="600" y="590" text-anchor="middle" font-size="18" fill="#64748B">→ 显存/内存资源持续紧张，推理成本居高不下</text>

  <text x="1160" y="660" text-anchor="end" font-size="14" fill="#94A3B8">《从池化内存看CXL》配图 1</text>
</svg>
