<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1200" height="8" fill="#2563EB"/>
  <text x="600" y="72" text-anchor="middle" font-size="34" font-weight="bold" fill="#0F2A5C">资源孤岛：内存"旱涝不均"，却无法互借</text>
  <text x="600" y="108" text-anchor="middle" font-size="18" fill="#64748B">传统服务器的内存焊死在本机，利用率两极分化</text>

  <!-- server A -->
  <g>
    <rect x="90" y="170" width="230" height="300" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="90" y="170" width="230" height="46" rx="16" fill="#0F2A5C"/>
    <rect x="90" y="196" width="230" height="20" fill="#0F2A5C"/>
    <text x="205" y="201" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">服务器 A</text>
    <rect x="145" y="240" width="120" height="44" rx="8" fill="#1E3A8A"/>
    <text x="205" y="268" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">CPU</text>
    <rect x="120" y="316" width="170" height="26" rx="13" fill="#E2E8F0"/>
    <rect x="120" y="316" width="42" height="26" rx="13" fill="#059669"/>
    <text x="205" y="384" text-anchor="middle" font-size="26" font-weight="bold" fill="#059669">25%</text>
    <text x="205" y="418" text-anchor="middle" font-size="17" fill="#059669">大量闲置</text>
  </g>

  <!-- server B -->
  <g>
    <rect x="370" y="170" width="230" height="300" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="370" y="170" width="230" height="46" rx="16" fill="#0F2A5C"/>
    <rect x="370" y="196" width="230" height="20" fill="#0F2A5C"/>
    <text x="485" y="201" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">服务器 B</text>
    <rect x="425" y="240" width="120" height="44" rx="8" fill="#1E3A8A"/>
    <text x="485" y="268" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">CPU</text>
    <rect x="400" y="316" width="170" height="26" rx="13" fill="#E2E8F0"/>
    <rect x="400" y="316" width="68" height="26" rx="13" fill="#0891B2"/>
    <text x="485" y="384" text-anchor="middle" font-size="26" font-weight="bold" fill="#0891B2">40%</text>
    <text x="485" y="418" text-anchor="middle" font-size="17" fill="#0891B2">尚有富余</text>
  </g>

  <!-- server C -->
  <g>
    <rect x="650" y="170" width="230" height="300" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="650" y="170" width="230" height="46" rx="16" fill="#0F2A5C"/>
    <rect x="650" y="196" width="230" height="20" fill="#0F2A5C"/>
    <text x="765" y="201" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">服务器 C</text>
    <rect x="705" y="240" width="120" height="44" rx="8" fill="#1E3A8A"/>
    <text x="765" y="268" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">CPU</text>
    <rect x="680" y="316" width="170" height="26" rx="13" fill="#E2E8F0"/>
    <rect x="680" y="316" width="144" height="26" rx="13" fill="#F97316"/>
    <text x="765" y="384" text-anchor="middle" font-size="26" font-weight="bold" fill="#F97316">85%</text>
    <text x="765" y="418" text-anchor="middle" font-size="17" fill="#F97316">持续紧张</text>
  </g>

  <!-- server D -->
  <g>
    <rect x="930" y="170" width="230" height="300" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="930" y="170" width="230" height="46" rx="16" fill="#0F2A5C"/>
    <rect x="930" y="196" width="230" height="20" fill="#0F2A5C"/>
    <text x="1045" y="201" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">服务器 D</text>
    <rect x="985" y="240" width="120" height="44" rx="8" fill="#1E3A8A"/>
    <text x="1045" y="268" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">CPU</text>
    <rect x="960" y="316" width="170" height="26" rx="13" fill="#E2E8F0"/>
    <rect x="960" y="316" width="161" height="26" rx="13" fill="#DC2626"/>
    <text x="1045" y="384" text-anchor="middle" font-size="26" font-weight="bold" fill="#DC2626">95%</text>
    <text x="1045" y="418" text-anchor="middle" font-size="17" fill="#DC2626">内存告急</text>
  </g>

  <!-- blocked transfer arrows -->
  <g>
    <line x1="325" y1="340" x2="365" y2="340" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 5"/>
    <circle cx="345" cy="340" r="17" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <line x1="337" y1="332" x2="353" y2="348" stroke="#DC2626" stroke-width="3"/>
    <line x1="353" y1="332" x2="337" y2="348" stroke="#DC2626" stroke-width="3"/>

    <line x1="605" y1="340" x2="645" y2="340" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 5"/>
    <circle cx="625" cy="340" r="17" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <line x1="617" y1="332" x2="633" y2="348" stroke="#DC2626" stroke-width="3"/>
    <line x1="633" y1="332" x2="617" y2="348" stroke="#DC2626" stroke-width="3"/>

    <line x1="885" y1="340" x2="925" y2="340" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 5"/>
    <circle cx="905" cy="340" r="17" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <line x1="897" y1="332" x2="913" y2="348" stroke="#DC2626" stroke-width="3"/>
    <line x1="913" y1="332" x2="897" y2="348" stroke="#DC2626" stroke-width="3"/>
  </g>

  <rect x="140" y="520" width="920" height="66" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="600" y="550" text-anchor="middle" font-size="20" fill="#334155">内存焊死在主板上，只能本机使用</text>
  <text x="600" y="576" text-anchor="middle" font-size="17" fill="#64748B">→ 无法像水电一样跨机器统一调度，白白浪费</text>
  <text x="1160" y="660" text-anchor="end" font-size="14" fill="#94A3B8">《从池化内存看CXL》配图 3</text>
</svg>
