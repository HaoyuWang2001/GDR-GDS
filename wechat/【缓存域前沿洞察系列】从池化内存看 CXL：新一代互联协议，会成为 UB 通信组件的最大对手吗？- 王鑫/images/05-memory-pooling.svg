<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1200" height="8" fill="#2563EB"/>
  <text x="600" y="66" text-anchor="middle" font-size="34" font-weight="bold" fill="#0F2A5C">内存池化：从"自打水井"到"自来水厂"</text>
  <text x="600" y="100" text-anchor="middle" font-size="18" fill="#64748B">内存集中成池，CXL交换机按需分配 —— 谁缺给谁，用完归还</text>

  <!-- servers -->
  <g>
    <rect x="95" y="126" width="220" height="104" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="205" y="156" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F2A5C">服务器 1</text>
    <rect x="120" y="172" width="80" height="36" rx="6" fill="#1E3A8A"/>
    <text x="160" y="196" text-anchor="middle" font-size="14" fill="#FFFFFF">CPU</text>
    <rect x="212" y="172" width="80" height="36" rx="6" fill="#93C5FD"/>
    <text x="252" y="196" text-anchor="middle" font-size="13" fill="#0F2A5C">本地内存</text>
  </g>
  <g>
    <rect x="375" y="126" width="220" height="104" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="485" y="156" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F2A5C">服务器 2</text>
    <rect x="400" y="172" width="80" height="36" rx="6" fill="#1E3A8A"/>
    <text x="440" y="196" text-anchor="middle" font-size="14" fill="#FFFFFF">CPU</text>
    <rect x="492" y="172" width="80" height="36" rx="6" fill="#93C5FD"/>
    <text x="532" y="196" text-anchor="middle" font-size="13" fill="#0F2A5C">本地内存</text>
  </g>
  <g>
    <rect x="655" y="126" width="220" height="104" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="765" y="156" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F2A5C">服务器 3</text>
    <rect x="680" y="172" width="80" height="36" rx="6" fill="#1E3A8A"/>
    <text x="720" y="196" text-anchor="middle" font-size="14" fill="#FFFFFF">CPU</text>
    <rect x="772" y="172" width="80" height="36" rx="6" fill="#93C5FD"/>
    <text x="812" y="196" text-anchor="middle" font-size="13" fill="#0F2A5C">本地内存</text>
  </g>
  <g>
    <rect x="935" y="126" width="220" height="104" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="1045" y="156" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F2A5C">服务器 4</text>
    <rect x="960" y="172" width="80" height="36" rx="6" fill="#1E3A8A"/>
    <text x="1000" y="196" text-anchor="middle" font-size="14" fill="#FFFFFF">CPU</text>
    <rect x="1052" y="172" width="80" height="36" rx="6" fill="#93C5FD"/>
    <text x="1092" y="196" text-anchor="middle" font-size="13" fill="#0F2A5C">本地内存</text>
  </g>

  <!-- arrows down to switch -->
  <g stroke="#7C3AED" stroke-width="3">
    <line x1="205" y1="230" x2="205" y2="288" marker-end="url(#arr5)"/>
    <line x1="485" y1="230" x2="485" y2="288" marker-end="url(#arr5)"/>
    <line x1="765" y1="230" x2="765" y2="288" marker-end="url(#arr5)"/>
    <line x1="1045" y1="230" x2="1045" y2="288" marker-end="url(#arr5)"/>
  </g>

  <!-- switch -->
  <rect x="140" y="296" width="920" height="62" rx="31" fill="#7C3AED"/>
  <text x="600" y="335" text-anchor="middle" font-size="23" font-weight="bold" fill="#FFFFFF">CXL Switch · 内存交换机</text>

  <!-- arrows down to pool -->
  <g stroke="#7C3AED" stroke-width="3" stroke-dasharray="8 6">
    <line x1="205" y1="358" x2="205" y2="428" marker-end="url(#arr5)"/>
    <line x1="485" y1="358" x2="485" y2="428" marker-end="url(#arr5)"/>
    <line x1="765" y1="358" x2="765" y2="428" marker-end="url(#arr5)"/>
    <line x1="1045" y1="358" x2="1045" y2="428" marker-end="url(#arr5)"/>
  </g>
  <text x="245" y="400" font-size="15" fill="#7C3AED">按需分配</text>
  <text x="900" y="400" font-size="15" fill="#7C3AED">用完归还</text>

  <!-- memory pool -->
  <rect x="140" y="436" width="920" height="150" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="600" y="470" text-anchor="middle" font-size="21" font-weight="bold" fill="#1E40AF">内存池 Memory Pool（集中管理）</text>
  <g fill="#2563EB">
    <rect x="185" y="492" width="140" height="64" rx="8"/>
    <rect x="365" y="492" width="140" height="64" rx="8"/>
    <rect x="545" y="492" width="140" height="64" rx="8"/>
    <rect x="725" y="492" width="140" height="64" rx="8"/>
    <rect x="905" y="492" width="140" height="64" rx="8"/>
  </g>
  <g fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">
    <text x="255" y="530">MEM</text>
    <text x="435" y="530">MEM</text>
    <text x="615" y="530">MEM</text>
    <text x="795" y="530">MEM</text>
    <text x="975" y="530">MEM</text>
  </g>

  <!-- footer stats -->
  <rect x="140" y="610" width="920" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="600" y="639" text-anchor="middle" font-size="18" fill="#475569">内存利用率 20%~30% → 70%+，显著降低TCO · 微软、三星、阿里已公开方案/原型</text>
  <text x="1160" y="668" text-anchor="end" font-size="14" fill="#94A3B8">《从池化内存看CXL》配图 5</text>
</svg>
