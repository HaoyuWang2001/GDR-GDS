<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1200" height="8" fill="#2563EB"/>
  <text x="600" y="72" text-anchor="middle" font-size="34" font-weight="bold" fill="#0F2A5C">内存墙：算力与内存带宽的"剪刀差"</text>
  <text x="600" y="108" text-anchor="middle" font-size="18" fill="#64748B">过去二十年，算力提升了数百倍，内存带宽增速远远掉队</text>

  <!-- gap shading -->
  <polygon points="160,545 1040,185 1040,430 160,545" fill="#FEE2E2" opacity="0.55"/>

  <!-- axes -->
  <line x1="140" y1="150" x2="140" y2="560" stroke="#94A3B8" stroke-width="2"/>
  <line x1="140" y1="560" x2="1070" y2="560" stroke="#94A3B8" stroke-width="2"/>
  <text x="150" y="140" font-size="16" fill="#64748B">相对性能（对数示意）</text>

  <!-- gridlines -->
  <line x1="140" y1="465" x2="1060" y2="465" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="140" y1="370" x2="1060" y2="370" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="140" y1="275" x2="1060" y2="275" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="140" y1="180" x2="1060" y2="180" stroke="#E2E8F0" stroke-width="1"/>

  <!-- compute line -->
  <line x1="160" y1="545" x2="1040" y2="185" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
  <text x="860" y="200" font-size="20" font-weight="bold" fill="#2563EB">算力增长（数百倍）</text>

  <!-- bandwidth line -->
  <line x1="160" y1="545" x2="1040" y2="430" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  <text x="820" y="462" font-size="20" font-weight="bold" fill="#DC2626">内存带宽增长（数十倍）</text>

  <!-- wall label -->
  <text x="560" y="310" text-anchor="middle" font-size="30" font-weight="bold" fill="#DC2626">内存墙 Memory Wall</text>
  <text x="560" y="342" text-anchor="middle" font-size="16" fill="#B91C1C">CPU/GPU 等米下锅，数据供不上</text>

  <!-- x ticks -->
  <text x="160" y="592" text-anchor="middle" font-size="16" fill="#64748B">2016</text>
  <text x="336" y="592" text-anchor="middle" font-size="16" fill="#64748B">2018</text>
  <text x="512" y="592" text-anchor="middle" font-size="16" fill="#64748B">2020</text>
  <text x="688" y="592" text-anchor="middle" font-size="16" fill="#64748B">2022</text>
  <text x="864" y="592" text-anchor="middle" font-size="16" fill="#64748B">2024</text>
  <text x="1040" y="592" text-anchor="middle" font-size="16" fill="#64748B">2026</text>

  <rect x="140" y="618" width="920" height="40" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="600" y="645" text-anchor="middle" font-size="17" fill="#475569">大模型越大、上下文越长，这道墙就越痛 —— 这正是池化内存要解决的问题</text>
  <text x="1160" y="668" text-anchor="end" font-size="14" fill="#94A3B8">配图 2 · 示意图</text>
</svg>
