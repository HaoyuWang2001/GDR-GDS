<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Project-local fontconfig: expose Windows fonts (WSL) for SVG->PNG rendering.
       Used via FONTCONFIG_FILE env var; no system-wide changes. -->
  <dir>/usr/share/fonts</dir>
  <dir>/mnt/c/Windows/Fonts</dir>
  <cachedir>/tmp/opencode/fontconfig-cache</cachedir>
</fontconfig>
